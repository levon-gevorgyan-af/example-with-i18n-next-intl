name: moorj-staging-deployment

on:
  workflow_call:
    inputs:
      service_role:
        required: true
        type: string
      image:
        required: true
        type: string
      dockerfile_path:
        required: true
        type: string
      chart_path:
        required: true
        type: string
      namespace:
        required: true
        type: string
      hostname:
        required: true
        type: string
      image_pull_secret:
        required: true
        type: string
      configuration_prefix:
        required: true
        type: string
    secrets:
      registry_username:
        required: true
      registry_password:
        required: true
      kubeconfig:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        run: |
           echo "$KUBE_CONFIG" | base64 --decode > kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.kubeconfig }}

      - name: Create registry-pull-secret
        run: |
          kubectl create secret docker-registry ${{ inputs.image_pull_secret }} \
            --docker-server=registry.moorj.dev:13443 \
            --docker-username=${{ secrets.registry_username }} \
            --docker-password=${{ secrets.registry_password }} \
            --namespace ${{ inputs.namespace }} \
             --dry-run=client -o yaml | kubectl apply --validate=false -f -
        env:
          KUBECONFIG: kubeconfig

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: registry.moorj.dev:13443
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: |
            ${{ inputs.image }}:${{ github.sha }}
            ${{ inputs.image }}:latest

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Deploy with Helm
        run: |
          export KUBECONFIG=$(pwd)/kubeconfig
          helm upgrade --install ${{ inputs.service_role }} ${{ inputs.chart_path }} \
            --namespace ${{ inputs.namespace }} \
            --set image=${{ inputs.image }}:${{ github.sha }} \
            --set hostname=${{ inputs.hostname }} \
            --set imagePullSecrets[0].name=${{ inputs.image_pull_secret }} \
            --set global.configurationPrefix=${{ inputs.configuration_prefix }}
