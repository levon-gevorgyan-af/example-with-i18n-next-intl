apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: shared-gateway
      namespace: envoy-gateway-system
      sectionName: wildcard-moorj-https
  hostnames:
    - {{ .Values.hostname }}
  rules:
    - backendRefs:
        - name: frontend
          port: {{ .Values.service.port }}
