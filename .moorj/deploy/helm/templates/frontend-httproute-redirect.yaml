apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-redirect
  namespace: moorj-levon-gevorgyan-af-example-with-i18n-next-intl-staging
spec:
  parentRefs:
    - name: shared-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - moorj-levon-gevorgyan-af-example-with-i18n-next-intl-staging.moorj.dev
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
